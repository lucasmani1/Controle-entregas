
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Entregas</title>
</head>

<body>

    <h1>Controle de Entregas</h1>

    <p>Meu primeiro aplicativo 🚀</p>

    <h2>Nova entrega</h2>

    <label>Valor recebido:</label>
    <input type="number" id="valor" placeholder="Ex: 15">

    <br><br>

    <label>Distância (km):</label>
    <input type="number" id="km" placeholder="Ex: 8">

    <br><br>

    <button onclick="calcular()">Calcular</button>

    <h2>Resultado</h2>

    <p id="resultado">Preencha os dados acima.</p>

    <script>
        function calcular() {
            const valor = Number(document.getElementById("valor").value);
            const km = Number(document.getElementById("km").value);

            if (valor <= 0 || km <= 0) {
                document.getElementById("resultado").innerText =
                    "Digite valores válidos.";
                return;
            }

            const gasolina = 7;
            const consumo = 22;

            const gastoCombustivel = (km / consumo) * gasolina;
            const lucro = valor - gastoCombustivel;

            document.getElementById("resultado").innerText =
                `Você recebeu R$ ${valor.toFixed(2)} e gastou aproximadamente R$ ${gastoCombustivel.toFixed(2)} de combustível. Lucro estimado: R$ ${lucro.toFixed(2)}.`;
        }
    </script>

</body>
</html>
